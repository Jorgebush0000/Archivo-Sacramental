name: Crear instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      ZIP_NAME: Archivo-Sacramental-Genealogico-v2.1.0-completo.zip

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Extraer proyecto del ZIP
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE $env:ZIP_NAME

          if (-not (Test-Path $zip)) {
            throw "No se encontró el ZIP del proyecto: $zip"
          }

          $destino = Join-Path $env:RUNNER_TEMP "ArchivoSacramental"

          if (Test-Path $destino) {
            Remove-Item $destino -Recurse -Force
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $destino -Force

          $pkg = Get-ChildItem -Path $destino -Filter package.json -Recurse -File |
            Select-Object -First 1

          if (-not $pkg) {
            throw "El ZIP no contiene package.json."
          }

          "PROJECT_DIR=$($pkg.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Proyecto encontrado en: $($pkg.Directory.FullName)"

      - name: Corregir propiedad duplicada en App.tsx
        shell: pwsh
        run: |
          $app = Join-Path $env:PROJECT_DIR "src/App.tsx"

          if (-not (Test-Path $app)) {
            throw "No se encontró src/App.tsx."
          }

          $original = Get-Content -Path $app -Raw

          # Corrige el patrón defectuoso conocido, si está presente.
          $fixed = [regex]::Replace(
            $original,
            "toYear:''\s*,\s*\[key\]:value",
            "toYear:''"
          )

          if ($fixed -ne $original) {
            Set-Content -Path $app -Value $fixed -Encoding utf8
            Write-Host "Se corrigió el patrón defectuoso."
          }
          else {
            Write-Host "El patrón anterior no aparece. Se muestran las líneas 245-255:"
            $lines = Get-Content -Path $app

            for ($i = 244; $i -lt [Math]::Min(255, $lines.Count); $i++) {
              Write-Host "$($i + 1): $($lines[$i])"
            }

            throw "No se pudo identificar automáticamente la propiedad duplicada. Revisa las líneas mostradas."
          }

      - name: Corregir importación de App
        shell: pwsh
        run: |
          $app = Join-Path $env:PROJECT_DIR "src/App.tsx"
          $main = Join-Path $env:PROJECT_DIR "src/main.tsx"

          if (-not (Test-Path $app)) {
            throw "No se encontró src/App.tsx."
          }

          if (-not (Test-Path $main)) {
            throw "No se encontró src/main.tsx."
          }

          $appText = Get-Content -Path $app -Raw
          $mainText = Get-Content -Path $main -Raw

          if ($appText -match '(?m)\bexport\s+default\b') {
            Write-Host "App.tsx ya tiene exportación predeterminada."
          }
          elseif (
            $appText -match '(?m)^\s*(?:export\s+)?(?:const|let|var)\s+App\s*=' -or
            $appText -match '(?m)^\s*(?:export\s+)?function\s+App\s*\('
          ) {
            Add-Content -Path $app -Value "`r`nexport default App;" -Encoding utf8
            Write-Host "Se añadió export default App."
          }
          else {
            Write-Host "No se reconoce la declaración del componente App."
            Get-Content -Path $app -TotalCount 100
            throw "No se pudo corregir la exportación de App automáticamente."
          }

      - name: Instalar dependencias
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm install

      - name: Compilar y generar instalador EXE
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm run dist:win

      - name: Preparar archivos del instalador
        shell: pwsh
        run: |
          $release = Join-Path $env:PROJECT_DIR "release"
          $salida = Join-Path $env:RUNNER_TEMP "instalador-windows"

          if (-not (Test-Path $release)) {
            throw "No se creó la carpeta release."
          }

          $archivos = @(
            Get-ChildItem -Path $release -File -Recurse |
              Where-Object { $_.Extension -in '.exe', '.zip' }
          )

          if (-not ($archivos | Where-Object { $_.Extension -eq '.exe' })) {
            throw "No se generó ningún instalador .exe."
          }

          New-Item -ItemType Directory -Path $salida -Force | Out-Null
          $archivos | Copy-Item -Destination $salida -Force

          Get-ChildItem -Path $salida

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: ${{ runner.temp }}/instalador-windows/*
          if-no-files-found: error
          retention-days: 14
