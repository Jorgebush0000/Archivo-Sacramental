name: Crear instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extraer proyecto
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "Archivo-Sacramental-Genealogico-v2.1.0-completo.zip"
          if (!(Test-Path $zip)) {
            throw "No se encontró el ZIP del proyecto."
          }

          $destino = Join-Path $env:RUNNER_TEMP "ArchivoSacramental"
          Expand-Archive -LiteralPath $zip -DestinationPath $destino -Force

          $pkg = Get-ChildItem -Path $destino -Filter package.json -Recurse -File |
            Select-Object -First 1

          if (!$pkg) {
            throw "El ZIP no contiene package.json."
          }

          "PROJECT_DIR=$($pkg.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Mostrar código que debemos corregir
        shell: pwsh
        run: |
          $app = Join-Path $env:PROJECT_DIR "src/App.tsx"
          $main = Join-Path $env:PROJECT_DIR "src/main.tsx"

          if (!(Test-Path $app)) {
            throw "No se encontró src/App.tsx."
          }

          Write-Host "===== src/App.tsx: líneas 235 a 265 ====="
          $lines = Get-Content $app
          $start = [Math]::Max(0, 234)
          $end = [Math]::Min($lines.Length - 1, 264)

          for ($i = $start; $i -le $end; $i++) {
            Write-Host ("Línea {0}: {1}" -f ($i + 1), $lines[$i])
          }

          Write-Host "===== src/main.tsx ====="
          if (Test-Path $main) {
            Get-Content $main
          }

          throw "Diagnóstico detenido. Necesitamos corregir el código señalado antes de compilar."
