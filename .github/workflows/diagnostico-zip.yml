name: Diagnosticar ZIP del proyecto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar y revisar ZIP
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'diagnostico.txt'

          $zip = Get-ChildItem -Path . -Filter '*.zip' -File | Select-Object -First 1
          if (-not $zip) {
            "No se encontró ningún ZIP en la raíz del repositorio." | Out-File $report -Encoding utf8
            throw "No se encontró ningún ZIP en la raíz del repositorio."
          }

          $dest = Join-Path $env:RUNNER_TEMP 'proyecto'
          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }

          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dest -Force

          "ZIP: $($zip.Name)" | Out-File $report -Encoding utf8
          "`r`nARCHIVOS PRINCIPALES:" | Out-File $report -Append -Encoding utf8
          Get-ChildItem $dest -Force | Select-Object Name, Mode | Format-Table -AutoSize | Out-String | Out-File $report -Append -Encoding utf8

          "`r`nPACKAGE.JSON:" | Out-File $report -Append -Encoding utf8
          $packages = Get-ChildItem $dest -Filter 'package.json' -File -Recurse

          if ($packages) {
            foreach ($pkg in $packages) {
              "`r`n--- $($pkg.FullName) ---" | Out-File $report -Append -Encoding utf8
              Get-Content -LiteralPath $pkg.FullName | Out-File $report -Append -Encoding utf8
            }
          } else {
            "No se encontró package.json." | Out-File $report -Append -Encoding utf8
          }

      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-diagnostico-zip
          path: ${{ runner.temp }}\diagnostico.txt
          if-no-files-found: warn
